<div class="books-dashboard">

  <!-- ================= MOTORE DI RICERCA ================= -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Cerca libro..."
      [(ngModel)]="search.name"
      (keydown.enter)="getClientBooks()"
    />
    <span class="search-icon">🔍</span>
  </div>

  <!-- ================= COLONNE ================= -->
  <div class="books-columns">

    <!-- ===== I TUOI LIBRI ===== -->
    <div class="books-column">
      <h2>📚 I tuoi libri</h2>

      <div class="books-list">
        <div
          class="book-card"
          *ngFor="let book of rows_out.results; let i = index"
          [ngClass]="'page-card-' + i"
        >
          <div class="book-info">
            <span class="book-title">{{ book.name }}</span>
            <span class="book-status" [ngClass]="book.status">
              {{ book.book_status }}
            </span>
          </div>

          <button
            *ngIf="book.book_status === 'ricevuto'"
            class="btn-deliver"
            (click)="deliverBook(book, 'magazzino')"
          >
            Consegna
          </button>
        </div>
      </div>

      <!-- PAGINAZIONE TUOI LIBRI -->
      <div class="pagination">
        <app-paginator
              [currentPage]="rows_out.page"
              [totalPages]="rows_out.pages"
              [pageSize]="rows_out.per_page"
              (pageChange)="onFooterPageChange($event, rows_out, 'out')"
            ></app-paginator>
      </div>

    </div>

    <!-- ===== MAGAZZINO ===== -->
    <div class="books-column">
      <h2>🏢 Libri dal magazzino</h2>

      <div class="books-list">
        <div
          class="book-card"
          *ngFor="let book of rows_mag.results; let i = index"
          [ngClass]="'page-card-' + i + ' warehouse-card'"
        >
          <div class="book-info">
            <span class="book-title">{{ book.name }}</span>
          </div>

          <button
            class="btn-request"
            (click)="requestBookFromWarehouse(book, 'ricevuto')"
          >
            Richiedi
          </button>
        </div>
      </div>

      <!-- PAGINAZIONE MAGAZZINO -->
      <div class="pagination">
        <app-paginator
              [currentPage]="rows_mag.page"
              [totalPages]="rows_mag.pages"
              [pageSize]="rows_mag.per_page"
              (pageChange)="onFooterPageChange($event, rows_mag, 'magazzino')"
            ></app-paginator>
      </div>

    </div> <!--FINE books-columns -->

  </div>

  <!-- ================= DASHBOARD RICHIESTE ================= -->
  <div class="requested-dashboard" *ngIf="rows_order.results.length > 0">
    <h2>📊 Libri richiesti</h2>

    <div class="requested-grid">
      <div
        class="requested-card"
        *ngFor="let book of rows_order.results; trackBy: trackByTitle; let i = index"
        [ngClass]="{
          'status-ordinato': book.book_status === 'ordinato',
          'status-transito': book.book_status === 'in transito'
        }"
      >
        <div class="requested-title">📕 {{ book.name }}</div>
        <div class="requested-status">
          <ng-container *ngIf="book.book_status === 'ordinato'">
            ⏳ In attesa
          </ng-container>
          <ng-container *ngIf="book.book_status === 'in transito'">
            🚚 In transito
          </ng-container>
        </div>
      </div>
    </div>

    <!-- PAGINAZIONE DASHBOARD RICHIESTE -->
    <div class="pagination">
      <app-paginator
        [currentPage]="rows_order.page"
        [totalPages]="rows_order.pages"
        [pageSize]="rows_order.per_page"
        (pageChange)="onFooterPageChange($event, rows_order, 'order')"
      ></app-paginator>
    </div>
  </div>

</div>
