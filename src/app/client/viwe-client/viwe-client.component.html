<div class="books-dashboard">
  <!-- Motore di ricerca -->
  <div class="search-bar">
    <input type="text" placeholder="Cerca libro..." [(ngModel)]="searchTerm" (input)="filterBooks()" />
    <span class="search-icon">🔍</span>
  </div>

  <div class="books-columns">
    <!-- Libri in possesso -->
    <div class="books-column">
      <h2>📚 I tuoi libri</h2>
      <div class="books-list">
        <div class="book-card" *ngFor="let book of pagedUserBooks">
          <div class="book-info">
            <span class="book-title">{{ book.title }}</span>
            <span class="book-status" [ngClass]="book.status">{{ book.status }}</span>
          </div>
          <button *ngIf="book.status === 'in possesso'" class="btn-deliver" (click)="deliverBook(book)">
            Consegna
          </button>
        </div>
      </div>

      <!-- Paginazione -->
      <div class="pagination">
        <button (click)="userPrevPage()" [disabled]="userCurrentPage === 0">&lt;</button>
        <button *ngFor="let page of [].constructor(userTotalPages()); let i = index"
                (click)="userGoToPage(i + 1)"
                [class.active]="i === userCurrentPage">{{ i + 1 }}</button>
        <button (click)="userNextPage()" [disabled]="userCurrentPage === userTotalPages() - 1">&gt;</button>
      </div>
    </div>

    <!-- Libri disponibili -->
    <div class="books-column">
      <h2>🏢 Libri dal magazzino</h2>
      <div class="books-list">
        <div class="book-card" *ngFor="let book of pagedAvailableBooks">
          <div class="book-info">
            <span class="book-title">{{ book }}</span>
          </div>
          <button class="btn-request" (click)="requestBookFromWarehouse(book)">
            Richiedi
          </button>
        </div>
      </div>

      <!-- Paginazione -->
      <div class="pagination">
        <button (click)="availablePrevPage()" [disabled]="availableCurrentPage === 0">&lt;</button>
        <button *ngFor="let page of [].constructor(availableTotalPages()); let i = index"
                (click)="availableGoToPage(i + 1)"
                [class.active]="i === availableCurrentPage">{{ i + 1 }}</button>
        <button (click)="availableNextPage()" [disabled]="availableCurrentPage === availableTotalPages() - 1">&gt;</button>
      </div>
    </div>
  </div>
</div>
