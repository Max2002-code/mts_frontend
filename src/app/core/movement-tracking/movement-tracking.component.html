<div class="tracking-dashboard">
  <mat-card class="books-card full-width elevated">
    <mat-card-title>📚 Elenco Libri</mat-card-title>

    <div class="books-table">
      <div class="table-header">
        <div class="col name">Nome Libro</div>
        <div class="col position">Posizione</div>
        <div class="col history">Storico</div>
      </div>

      <div class="table-row" *ngFor="let book of books">
        <div class="col name">{{ book.bookTitle }}</div>

        <div class="col position">
          Scaffale: {{ book.shelf || '-' }}<br>
          Bancale: {{ book.bancale || '-' }}<br>
          Lato: {{ book.side || '-' }}
        </div>

        <div class="col history">
          <button (click)="selectedBook = book">Mostra storico</button>
        </div>
      </div>
    </div>
  </mat-card>
</div>

<!-- Modale semplice -->
<div class="modal-backdrop" *ngIf="selectedBook">
  <div class="modal">
    <h2>📚 Storico - {{ selectedBook.bookTitle }}</h2>
    <ul class="history-list">
      <li *ngFor="let h of getSortedHistory(selectedBook)">
        <strong>{{ h.date | date:'dd/MM/yyyy' }}</strong> - 
        {{ h.description }}
        <span *ngIf="h.note">({{ h.note }})</span>
      </li>
    </ul>
    <button (click)="selectedBook = null">Chiudi</button>
  </div>
</div>
