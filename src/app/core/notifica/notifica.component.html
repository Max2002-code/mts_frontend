<div class="notifiche-page">
  <h1 class="title">🔔 Notifiche</h1>

  <ng-container *ngIf="notifiche.length > 0; else vuoto">
    <div class="notifiche-grid">
      <mat-card class="notifica-card" *ngFor="let n of notifiche" [ngClass]="{'notifica-letta': n.read}">
        
        <!-- HEADER -->
        <div class="notifica-header">
          <mat-icon class="icon" [class]="getIconClass(n.movement.order_status)">notifications</mat-icon>
          <div class="testo">
            <h4>{{ n.title }}</h4>
            <p>{{ n.message }}</p>
            <p *ngIf="n.read">{{ n.movement.order_status }}</p>
          </div>
        </div>

        <!-- AZIONI -->
        <div class="azioni" *ngIf="!n.read && currentuUser?.company?.name === 'Mts'">
          <button mat-raised-button class="accetta" (click)="accetta(n)">
            ✔ Accetta
          </button>
          <button mat-raised-button class="rifiuta" (click)="rifiuta(n)">
            ✖ Rifiuta
          </button>
        </div>

      </mat-card>
    </div>
  </ng-container>

  <!-- Messaggio se non ci sono notifiche -->
  <ng-template #vuoto>
    <div class="vuoto">
      Nessuna notifica disponibile 🎉
    </div>
  </ng-template>
</div>
