<div class="search-container">

  <!-- ===================== PANNELLO SINISTRA ===================== -->
  <div class="left-panel">

    <!-- CARD DI RICERCA LIBRO -->
    <div class="search-bar-container">
      <mat-form-field appearance="outline" class="search-bar">
        <mat-label>Cerca libro</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          [(ngModel)]="search.name"
          placeholder="Titolo del libro"
          (keydown.enter)="getBooks()"
        />
        <button
          mat-icon-button
          matSuffix
          color="primary"
          (click)="getBooks()"
          aria-label="Cerca"
        >
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <!-- ===================== LIBRI DISPONIBILI ===================== -->
    <div class="other-books">
      <div class="header">
  <h3>📚 Libri disponibili</h3>
  <button class="new-book" (click)="openAddBooksDialog()">
    <span class="plus-icon">+</span> Aggiungi
  </button>
</div>


      <div class="book-cards-container">
        <mat-card class="book-card modern" *ngFor="let book of rows.results">
          <mat-card-header>
            <div mat-card-avatar class="book-avatar">📖</div>
            <mat-card-title>{{ book.name }}</mat-card-title>
          </mat-card-header>

          <mat-card-actions align="end">
            <button
              mat-stroked-button
              color="primary"
              (click)="openPergamena(book)"
            >
              Vedi posizione
            </button>
          </mat-card-actions>
        </mat-card>
      </div>

      <app-paginator
        [currentPage]="rows.page"
        [totalPages]="rows.pages"
        [pageSize]="rows.per_page"
        (pageChange)="onFooterPageChange($event)"
      ></app-paginator>
    </div>
  </div>
</div>

<!-- ===================== MODALE AGGIUNGI LIBRO ===================== -->
<ng-template #addBooksDialog>
  <h2>Aggiungi un nuovo libro</h2>
  <form>
    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Nome libro</mat-label>
      <input matInput [(ngModel)]="newBook.name" name="name" placeholder="Inserisci il nome">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Scaffale</mat-label>
      <input matInput [(ngModel)]="newBook.scaffale" name="scaffale" placeholder="Inserisci scaffale">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>X</mat-label>
      <input matInput type="number" [(ngModel)]="newBook.x" name="x">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Y</mat-label>
      <input matInput type="number" [(ngModel)]="newBook.y" name="y">
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Lato</mat-label>
      <mat-select [(ngModel)]="newBook.lato" name="lato">
        <mat-option value="destra">Destra</mat-option>
        <mat-option value="sinistra">Sinistra</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" style="width:100%">
      <mat-label>Compagnia</mat-label>
      <input matInput [(ngModel)]="newBook.company" name="company" placeholder="Nome compagnia">
    </mat-form-field>

    <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
      <button mat-button mat-dialog-close>Chiudi</button>
      <button mat-raised-button color="primary" (click)="saveBook()">Salva</button>
    </div>
  </form>
</ng-template>

<!-- ===================== MODALE POSIZIONE PERGAMENA ===================== -->
<div class="full-pergamena" *ngIf="pergamenaVisible" (click)="pergamenaVisible = false">
  <div class="pergamena-rotolo" (click)="$event.stopPropagation()">
    <h2>📍 Posizione libro</h2>
    <p><strong>Cliente:</strong> {{ result.company.name }}</p>
    <p><strong>Scaffale:</strong> {{ result.scaffale }}</p>
    <p><strong>Livello:</strong> ( {{ result.x }} ; {{ result.y }} ) {{ result.lato }} </p>
    <button (click)="pergamenaVisible=false">Chiudi</button>
  </div>
</div>
