<footer class="paginator-footer" *ngIf="totalPages > 1">
  <div class="paginator-container">
    
    <!-- Pulsante precedente -->
    <button class="page-btn" (click)="prev()" [disabled]="currentPage === 1">
      ◀ Precedente
    </button>

    <!-- Info pagina -->
    <div class="page-info">
      Pagina
      <input
        type="number"
        [(ngModel)]="inputPage"
        (keyup.enter)="submitPage()"
        min="1"
        [max]="totalPages"
        class="page-input"
      />
      di <strong>{{ totalPages }}</strong>
      <span class="total-items">| Totale: {{ totalItems }}</span>
    </div>

    <!-- Vai -->
    <button class="page-btn go-btn" (click)="submitPage()">Vai</button>

    <!-- Pulsante successivo -->
    <button class="page-btn" (click)="next()" [disabled]="currentPage === totalPages">
      Successivo ▶
    </button>

  </div>
</footer>
