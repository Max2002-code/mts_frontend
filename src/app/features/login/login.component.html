<div class="page">
  <div class="stage" aria-label="Login">
    
    <!-- FORM LOGIN -->
    <form
      class="form"
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
      #f="ngForm"
    >
      <!-- TITOLO -->
     <!-- Titolo con immagine -->
<img
  class="login-title-image"
  src="../../../assets/images/MTS LOGO.png"
  alt="Accedi"
/>


      <!-- CAMPO USERNAME -->
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          formControlName="username"
        />
      </div>

      <!-- CAMPO PASSWORD -->
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          formControlName="password"
        />
      </div>

      <!-- PULSANTE LOGIN -->
      <button
        type="submit"
        class="login-button"
        aria-label="Accedi"
      >
        Accedi
      </button>

      <!-- OPZIONI EXTRA (COMMENTATE) -->
      <!--
      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember" ngModel />
          Ricordami
        </label>

        <a class="link" routerLink="/forgot-password">Password dimenticata?</a>
      </div>

      <p class="footer">
        Non hai un account? <a class="link" routerLink="/register">Registrati</a>
      </p>
      -->

    </form>
  </div>
</div>
