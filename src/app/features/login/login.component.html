<div class="page">
  <div class="stage" aria-label="Login">

    <!-- FORM LOGIN -->
    <form
      class="form"
      [formGroup]="loginForm"
      (ngSubmit)="onLogin()"
      #f="ngForm"
    >
      <!-- TITOLO CON IMMAGINE -->
      <img
        class="login-title-image"
        src="../../../assets/images/MTS LOGO.png"
        alt="Accedi"
      />

      <!-- CAMPO USERNAME -->
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          formControlName="username"
          placeholder="Inserisci username"
        />
      </div>

      <!-- CAMPO PASSWORD -->
<div class="field">
  <label for="password">Password</label>

  <div class="password-wrapper">
    <input
      id="password"
      [type]="showPassword ? 'text' : 'password'"
      name="password"
      formControlName="password"
      placeholder="Inserisci password"
    />

    <button
      type="button"
      class="toggle-password"
      (click)="togglePassword()"
      aria-label="Mostra/Nascondi password"
    >
      {{ showPassword ? '🙈' : '👁️' }}
    </button>
  </div>
</div>



      <!-- PULSANTE LOGIN -->
      <button
        type="submit"
        class="login-button"
        aria-label="Accedi"
      >
        Accedi
      </button>

      <!-- OPZIONI EXTRA (COMMENTATE) -->

        <label class="check">

          Ricordami

      </div>

      <p class="footer">
        Non hai un account? <a class="link" routerLink="/register">Registrati</a>
      </p>
      -->

    </form>
  </div>
</div>
