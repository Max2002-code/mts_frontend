<div class="error-wrap">
  <div class="bg-ornaments"></div>

  <main class="sheet" role="main" aria-labelledby="errTitle">
    <header class="sheet__header">
      <div class="crest" aria-hidden="true">
        <span class="crest__dot"></span>
      </div>

      <p class="kicker">Archivio MTS</p>
      <h1 id="errTitle" class="title">Pagina smarrita</h1>
      <p class="subtitle">
        Il percorso indicato non esiste negli annali di questo archivio.
      </p>
    </header>

    <section class="sheet__body">
      <div class="status">
        <span class="status__code">404</span>
        <span class="status__label">Not Found</span>
      </div>

      <div class="actions">
        <a class="btn btn--gold" *ngIf="currentUser" (click)="goToHome()">Torna alla Home</a>
        <button class="btn btn--ghost" type="button" (click)="goBack()">
          Torna indietro
        </button>
      </div>

      <p class="hint">
        Se pensi sia un errore, prova a ricontrollare l’URL o contatta l’assistenza.
      </p>
    </section>
  </main>
</div>
